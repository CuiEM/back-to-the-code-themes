<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">Codex and Claude Code themes</title>
<desc id="desc">Preview of Back to the Code dark and light themes in Codex CLI and Claude Code.</desc>
