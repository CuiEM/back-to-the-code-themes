beration Mono",monospace' font-size="13px" font-weight="400" text-anchor="start">def train(epochs=88):</text><text x="236" y="643" fill="#2f3137" font-family='SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace' font-size="13px" font-weight="400" text-anchor="start">    for epoch in range(epochs):</text><text x="236" y="670" fill="#005f85" font-family='SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace' font-size="13px" font-weight="400" text-anchor="start">        loss = model.step(batch)</text><text x="236" y="697" fill="#8a6200" font-family='SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace' font-size="13px" font-weight="400" text-anchor="start">        print("loss", loss)</text><text x="236" y="724" fill="#177c66" font-family='SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace' font-size="13px" font-weight="400" text-anchor="start">+       save_checkpoint(model)</text><text x="78" y="774" fill="#2f3137" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="11px" font-weight="400" text-anchor="start">Light · /theme</text><rect x="724" y="492" width="624" height="304" rx="22" fill="#fafafc" stroke="#1c1d2118" stroke-width="1"/><rect x="724" y="492" width="624" height="46" rx="22" fill="#dbe5ef" stroke="none" stroke-width="0"/><rect x="724" y="516" width="624" height="22" rx="0" fill="#dbe5ef" stroke="none" stroke-width="0"/><circle cx="752" cy="515" r="6" fill="#ff6058"/><circle cx="774" cy="515" r="6" fill="#ffbd2e"/><circle cx="796" cy="515" r="6" fill="#28c840"/><text x="1036" y="521" fill="#2f3137" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13px" font-weight="650" text-anchor="middle">Claude Code</text><text x="750" y="565" fill="#c2184b" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="11px" font-weight="700" text-anchor="start">Back to the Code Light</text><rect x="748" y="584" width="576" height="54" rx="10" f